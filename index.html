<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Systemtools">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">

<script>var ROOT="";</script>
<script src="assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <h1 id="title">Systemtools</h1>
    <a class="iconbtn" href="einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
  <p class="sub">Werkzeuge für dein System, direkt im Browser</p>
  <div class="card row" id="installCard" style="justify-content:space-between;align-items:center;gap:12px" hidden>
    <span>Systemtools als App installieren: eigenes Symbol, ohne Browserleiste, auch offline.</span>
    <button class="btn" id="installBtn">Installieren</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Suchen …" aria-label="Werkzeuge durchsuchen">
  <div id="groups"></div>
  <p class="muted" id="noHit" hidden>Kein Werkzeug gefunden.</p>
  <h2>In der Web-Version nicht möglich</h2>
  <div class="card" id="nope"></div>
</main>

<script>
(function () {
"use strict";
/* Alte Hash-Links (#rechner, #einstellungen, ...) auf die neuen Seiten umleiten */
function redirect() {
  var id = ""; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (!id) return;
  if (id === "einstellungen") { location.replace("einstellungen/"); return; }
  var t = TOOLS.find(function (x) { return x.id === id; });
  if (t) location.replace(toolHref(t, ""));
}
redirect();
addEventListener("hashchange", redirect);

$("#nope").innerHTML = `<ul class="nope" style="margin:0;padding-left:18px">${NOT_POSSIBLE.map(([a, b]) => `<li><b>${a}</b>: ${b}</li>`).join("")}</ul>
  <p class="muted" style="font-size:14px;margin:10px 0 0">Diese Werkzeuge gibt es in der Android-App.</p>`;

const box = $("#groups");
const draw = q => {
  q = q.trim().toLowerCase();
  const hits = TOOLS.filter(t => !q || (t.title + " " + t.desc).toLowerCase().includes(q));
  box.innerHTML = GROUPS.map(g => {
    const items = hits.filter(t => t.group === g);
    if (!items.length) return "";
    return `<section class="group"><h2>${esc(g)}</h2><div class="tools">${items.map(t => `<a class="tool" href="${toolHref(t, "")}"><div class="ic">${ICONS[t.icon] || ICONS.info}</div><div><b>${t.title}</b><span>${t.desc}</span></div></a>`).join("")}</div></section>`;
  }).join("");
  $("#noHit").hidden = hits.length > 0;
};
const instDraw = () => { $("#installCard").hidden = !install.prompt || install.standalone; };
$("#installBtn").onclick = () => installApp();
install.subs.add(instDraw); instDraw();
$("#q").oninput = e => draw(e.target.value);
draw("");
})();
</script>
</body>
</html>
