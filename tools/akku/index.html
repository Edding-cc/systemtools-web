<main class="wrap" id="app"></main>
<script>
(function () {
"use strict";
/* =========================================================
   Akku
   ========================================================= */
function viewAkku(app) {
  app.innerHTML = `<div class="hint">Webseiten sehen nur Ladestand und Ladezustand. Temperatur, Spannung und Akkuzustand gibt der Browser nicht preis. Firefox und Safari unterstützen die Akku-Schnittstelle gar nicht.</div><div id="bat"></div>`;
  if (!navigator.getBattery) { $("#bat").innerHTML = `<div class="card">${supported(false)} <span class="muted">Dein Browser stellt keine Akku-Infos bereit.</span></div>`; return; }
  const secs = s => !isFinite(s) || s <= 0 ? "–" : `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
  navigator.getBattery().then(b => {
    const draw = () => {
      $("#bat").innerHTML = `<div class="card" style="text-align:center"><div class="big">${Math.round(b.level * 100)} <span class="unit">%</span></div>
        <div style="height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden;margin:12px 0"><div style="height:100%;width:${b.level * 100}%;background:${b.level < .15 ? "var(--err)" : "var(--ok)"}"></div></div>
        <div class="muted">${b.charging ? "Wird geladen" : "Entlädt"}</div></div>
        <div class="card">${kv({ "Ladezustand": b.charging ? "lädt" : "lädt nicht", "Voll in": b.charging ? secs(b.chargingTime) : "–", "Leer in": !b.charging ? secs(b.dischargingTime) : "–" })}</div>`;
    };
    draw();
    const evs = ["levelchange", "chargingchange", "chargingtimechange", "dischargingtimechange"];
    evs.forEach(e => b.addEventListener(e, draw));
    onLeave(() => evs.forEach(e => b.removeEventListener(e, draw)));
  });
}

viewAkku($("#app"));
})();
</script>
</body>
