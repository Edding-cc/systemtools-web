<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensoren · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
.bars{display:grid;gap:4px;margin-top:6px}
.bar{display:grid;grid-template-columns:18px 1fr 84px;gap:8px;align-items:center;font-size:13px;font-family:var(--mono)}
.bar .t{height:8px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.bar .t i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent);border-radius:4px}
:root[data-dark="1"] .bar .t i{background:color-mix(in srgb,var(--accent) 55%,#fff)}
.bar .v{text-align:right}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Sensoren</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
(function () {
"use strict";
/* =========================================================
   Sensoren
   ========================================================= */
function viewSensoren(app) {
  const GENERIC = [
    ["Accelerometer", "Beschleunigung (inkl. Schwerkraft)", "m/s²", 20],
    ["LinearAccelerationSensor", "Lineare Beschleunigung", "m/s²", 20],
    ["GravitySensor", "Schwerkraft", "m/s²", 10],
    ["Gyroscope", "Gyroskop (Drehrate)", "rad/s", 10],
    ["Magnetometer", "Magnetfeld", "µT", 100],
    ["AbsoluteOrientationSensor", "Lage (absolut, Quaternion)", "", 1],
    ["RelativeOrientationSensor", "Lage (relativ, Quaternion)", "", 1],
    ["AmbientLightSensor", "Umgebungslicht", "lx", 0]
  ];
  app.innerHTML = `
    <div class="hint">Angezeigt wird, was dein Browser auf diesem Gerät bereitstellt. Am meisten liefern Chrome und Edge auf Android. Auf dem PC gibt es meist keine Sensoren. Für iPhone/iPad ist ein Tippen auf „Starten“ nötig.</div>
    <input class="search" id="q" type="search" placeholder="Suchen …">
    <div class="row" style="margin-bottom:12px"><button class="btn" id="go">Sensoren starten</button><span class="muted" id="cnt"></span></div>
    <div id="list"></div>`;
  const list = $("#list");
  const items = [];
  const add = (id, name, avail, info = "") => {
    const d = document.createElement("div"); d.className = "card"; d.dataset.name = name.toLowerCase();
    d.innerHTML = `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(name)}</h3>${supported(avail)}</div>${info ? `<div class="muted" style="font-size:13px">${esc(info)}</div>` : ""}<div class="val" id="v-${id}"></div>`;
    list.appendChild(d); items.push(d);
  };
  add("motion", "Bewegung (DeviceMotion)", "DeviceMotionEvent" in window, "Beschleunigung und Drehrate");
  add("orient", "Lage / Kompass (DeviceOrientation)", "DeviceOrientationEvent" in window, "Alpha = Kompassrichtung, Beta = Neigung vorne/hinten, Gamma = Neigung links/rechts");
  for (const [cls, name, unit] of GENERIC) add(cls, name, cls in window, `Generic Sensor API: ${cls}${unit ? " · " + unit : ""}`);
  add("geo", "Standort (GPS)", "geolocation" in navigator, "Breite, Länge, Höhe, Genauigkeit, Tempo");
  $("#cnt").textContent = `${items.filter(i => i.querySelector(".ok")).length} von ${items.length} Schnittstellen verfügbar`;
  $("#q").oninput = e => { const q = e.target.value.toLowerCase(); items.forEach(i => i.hidden = q && !i.dataset.name.includes(q)); };

  const bars = (vals, max) => `<div class="bars">${vals.map(([l, v, u = ""]) => {
    const f = v == null ? 0 : Math.max(-1, Math.min(1, v / max));
    return `<div class="bar"><span>${l}</span><span class="t"><i style="${f >= 0 ? `left:50%;width:${f * 50}%` : `left:${50 + f * 50}%;width:${-f * 50}%`}"></i></span><span class="v">${v == null ? "–" : nf(v, 2)}${u}</span></div>`;
  }).join("")}</div>`;
  const set = (id, html) => { const e = $("#v-" + CSS.escape(id)); if (e) e.innerHTML = html; };
  const stops = [];
  onLeave(() => stops.forEach(f => f()));
  let started = false;
  const throttle = (fn, ms = 100) => { let t = 0; return (...a) => { const n = performance.now(); if (n - t > ms) { t = n; fn(...a); } }; };

  $("#go").onclick = async () => {
    if (started) return; started = true; $("#go").disabled = true;
    try {
      if (typeof DeviceMotionEvent?.requestPermission === "function") await DeviceMotionEvent.requestPermission();
      if (typeof DeviceOrientationEvent?.requestPermission === "function") await DeviceOrientationEvent.requestPermission();
    } catch {}
    let gotMotion = false, gotOrient = false;
    const onMotion = throttle(e => {
      gotMotion = true;
      const a = e.accelerationIncludingGravity || {}, r = e.rotationRate || {};
      set("motion", bars([["x", a.x], ["y", a.y], ["z", a.z]], 20) + `<div class="muted" style="font-size:12px;margin-top:6px">Drehrate °/s</div>` + bars([["α", r.alpha], ["β", r.beta], ["γ", r.gamma]], 360));
    });
    // Chrome liefert die Nordrichtung nur über "deviceorientationabsolute", Safari über webkitCompassHeading
    let heading = null;
    const onAbs = e => { if (e.alpha != null) heading = (360 - e.alpha) % 360; };
    const onOrient = throttle(e => {
      gotOrient = true;
      const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? (360 - e.alpha) % 360 : heading);
      set("orient", bars([["α", e.alpha, "°"], ["β", e.beta, "°"], ["γ", e.gamma, "°"]], 180) + (h != null ? `<div style="margin-top:6px">Kompass: <b>${nf(h, 0)}°</b> ${["N","NO","O","SO","S","SW","W","NW"][Math.round(h / 45) % 8]}</div>` : ""));
    });
    addEventListener("devicemotion", onMotion); addEventListener("deviceorientation", onOrient); addEventListener("deviceorientationabsolute", onAbs);
    stops.push(() => { removeEventListener("devicemotion", onMotion); removeEventListener("deviceorientation", onOrient); removeEventListener("deviceorientationabsolute", onAbs); });
    setTimeout(() => {
      if (!gotMotion) set("motion", "<p class='muted' style='margin:6px 0 0'>Keine Werte – dieses Gerät hat vermutlich keinen Bewegungssensor.</p>");
      if (!gotOrient) set("orient", "<p class='muted' style='margin:6px 0 0'>Keine Werte – dieses Gerät hat vermutlich keinen Lagesensor.</p>");
    }, 1500);

    for (const [cls, , unit, max] of GENERIC) {
      if (!(cls in window)) continue;
      try {
        const s = new window[cls]({ frequency: 10 });
        set(cls, "<p class='muted' style='margin:6px 0 0'>Warte auf Werte … (Chrome liefert sie nur, solange die Seite im Vordergrund ist)</p>");
        s.onreading = throttle(() => {
          if (s.quaternion) set(cls, bars(s.quaternion.map((v, i) => ["xyzw"[i], v]), 1));
          else if ("illuminance" in s) set(cls, `<div class="big" style="font-size:28px">${nf(s.illuminance, 0)} <span class="unit">lx</span></div>`);
          else set(cls, bars([["x", s.x, ""], ["y", s.y, ""], ["z", s.z, ""]], max) + `<div class="muted" style="font-size:12px">${unit}</div>`);
        });
        s.onerror = e => set(cls, `<p class="muted" style="margin:6px 0 0">${e.error?.name === "NotAllowedError" ? "Zugriff verweigert." : e.error?.name === "NotReadableError" ? "Sensor nicht vorhanden." : esc(e.error?.message || "Fehler")}</p>`);
        s.start(); stops.push(() => s.stop());
      } catch (e) { set(cls, `<p class="muted" style="margin:6px 0 0">${esc(e.message)}</p>`); }
    }
    if ("geolocation" in navigator) {
      set("geo", "<p class='muted' style='margin:6px 0 0'>Warte auf Standort …</p>");
      const w = navigator.geolocation.watchPosition(p => {
        const c = p.coords;
        set("geo", kv({ "Breite": c.latitude.toFixed(6), "Länge": c.longitude.toFixed(6), "Genauigkeit": nf(c.accuracy, 0) + " m", "Höhe": c.altitude != null ? nf(c.altitude, 0) + " m" : null, "Tempo": c.speed != null ? nf(c.speed * 3.6, 1) + " km/h" : null, "Richtung": c.heading != null && !isNaN(c.heading) ? nf(c.heading, 0) + "°" : null, "Zeit": new Date(p.timestamp).toLocaleTimeString("de-DE") }));
      }, e => set("geo", `<p class="muted" style="margin:6px 0 0">${e.code === 1 ? "Standortzugriff verweigert." : "Standort nicht verfügbar."}</p>`), { enableHighAccuracy: true });
      stops.push(() => navigator.geolocation.clearWatch(w));
    }
    $("#go").textContent = "Läuft";
  };
}

viewSensoren($("#app"));
})();
</script>
</body>
</html>
