<main class="wrap" id="app"></main>
<script>
(function () {
"use strict";
/* =========================================================
   Netzwerk
   ========================================================= */
function viewNetzwerk(app) {
  const c = navigator.connection;
  app.innerHTML = `
    <div class="card"><h3>Verbindung</h3><div id="conn"></div></div>
    <div class="card"><h3>Öffentliche Adresse</h3><div id="pub"><button class="btn tonal" id="pubGo">Abfragen</button><p class="muted" style="font-size:13px;margin:8px 0 0">Fragt <span class="mono">speed.cloudflare.com/cdn-cgi/trace</span> ab. Cloudflare sieht dabei deine IP-Adresse.</p></div></div>`;
  const TYPE = { wifi: "WLAN", cellular: "Mobilfunk", ethernet: "Ethernet", bluetooth: "Bluetooth", none: "keine", other: "sonstige", unknown: "unbekannt", wimax: "WiMAX" };
  const draw = () => $("#conn").innerHTML = kv({
    "Status": navigator.onLine ? "online" : "offline",
    "Verbindungsart": c?.type ? TYPE[c.type] || c.type : c ? "vom Browser nicht angegeben" : "nicht verfügbar",
    "Effektiver Typ": c?.effectiveType?.toUpperCase(),
    "Geschätzte Bandbreite": c?.downlink != null ? nf(c.downlink, 1) + " Mbit/s (vom Browser gedeckelt)" : null,
    "Geschätzte Latenz": c?.rtt != null ? c.rtt + " ms" : null,
    "Datensparmodus": c?.saveData != null ? (c.saveData ? "an" : "aus") : null
  });
  draw();
  c?.addEventListener("change", draw); addEventListener("online", draw); addEventListener("offline", draw);
  onLeave(() => { c?.removeEventListener("change", draw); removeEventListener("online", draw); removeEventListener("offline", draw); });
  $("#pubGo").onclick = async () => {
    $("#pub").innerHTML = "<p class='muted'>Frage ab …</p>";
    try {
      const t = await (await fetch("https://speed.cloudflare.com/cdn-cgi/trace", { cache: "no-store" })).text();
      const o = Object.fromEntries(t.trim().split("\n").map(l => l.split("=")));
      $("#pub").innerHTML = kv({ "IP-Adresse": o.ip, "Protokoll": o.ip?.includes(":") ? "IPv6" : "IPv4", "Land": o.loc, "Rechenzentrum": o.colo, "HTTP": o.http, "TLS": o.tls, "Cloudflare WARP": o.warp }) + `<button class="btn text" id="cpIp" style="margin-top:8px">IP kopieren</button>`;
      $("#cpIp").onclick = () => copy(o.ip);
    } catch { $("#pub").innerHTML = "<p class='err'>Abfrage fehlgeschlagen.</p>"; }
  };
}

viewNetzwerk($("#app"));
})();
</script>
</body>
</html>
