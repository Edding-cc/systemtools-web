<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbundene Geräte · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">

<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Verbundene Geräte</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
(function () {
"use strict";
/* =========================================================
   Verbundene Geräte
   ========================================================= */
function viewGeraete(app) {
  const has = { media: !!navigator.mediaDevices?.enumerateDevices, gamepad: !!navigator.getGamepads, usb: !!navigator.usb, hid: !!navigator.hid, serial: !!navigator.serial, bt: !!navigator.bluetooth };
  app.innerHTML = `
    <div class="hint">Angezeigt wird, was der Browser preisgibt. USB-, HID-, Bluetooth- und serielle Geräte sieht eine Webseite erst, nachdem du sie einmal über „Gerät hinzufügen“ freigegeben hast (nur Chrome/Edge).</div>
    <input class="search" id="q" type="search" placeholder="Suchen …">
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Audio &amp; Kameras</h3>${supported(has.media)}</div><div id="media"></div>
      <div class="row" style="margin-top:8px"><button class="btn tonal" id="mediaPerm">Namen anzeigen (Zugriff erlauben)</button></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Controller</h3>${supported(has.gamepad)}</div><div id="pads"><p class="muted" style="margin:6px 0 0">Drücke eine Taste am Controller, damit er erscheint.</p></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">USB</h3>${supported(has.usb)}</div><div id="usb"></div><button class="btn tonal" id="usbAdd" ${has.usb ? "" : "disabled"}>Gerät hinzufügen</button></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Eingabegeräte (HID)</h3>${supported(has.hid)}</div><div id="hid"></div><button class="btn tonal" id="hidAdd" ${has.hid ? "" : "disabled"}>Gerät hinzufügen</button></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Bluetooth</h3>${supported(has.bt)}</div><div id="bt"></div><button class="btn tonal" id="btAdd" ${has.bt ? "" : "disabled"}>Gerät suchen</button></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Seriell</h3>${supported(has.serial)}</div><div id="serial"></div><button class="btn tonal" id="serialAdd" ${has.serial ? "" : "disabled"}>Gerät hinzufügen</button></div>`;
  $("#q").oninput = e => { const q = e.target.value.toLowerCase(); $$(".list-item", app).forEach(i => i.hidden = q && !i.textContent.toLowerCase().includes(q)); $$(".card", app).forEach(c => c.hidden = q && !c.textContent.toLowerCase().includes(q)); };
  const li = (title, sub) => `<div class="list-item"><div class="grow"><b>${esc(title)}</b><small>${sub}</small></div></div>`;
  const hex4 = n => "0x" + (n ?? 0).toString(16).padStart(4, "0");
  const KIND = { audioinput: "Mikrofon", audiooutput: "Lautsprecher/Ausgabe", videoinput: "Kamera" };

  async function media() {
    if (!has.media) return;
    const d = await navigator.mediaDevices.enumerateDevices();
    $("#media").innerHTML = d.length ? d.map(x => li(x.label || KIND[x.kind] + " (Name verborgen)", esc(KIND[x.kind] || x.kind) + (x.deviceId === "default" ? " · Standard" : ""))).join("") : "<p class='muted'>Keine gefunden.</p>";
    if (d.some(x => x.label)) $("#mediaPerm").hidden = true;
  }
  media();
  if (has.media) { navigator.mediaDevices.addEventListener("devicechange", media); onLeave(() => navigator.mediaDevices.removeEventListener("devicechange", media)); }
  $("#mediaPerm").onclick = async () => {
    for (const c of [{ audio: true, video: true }, { audio: true }, { video: true }]) {
      try { const s = await navigator.mediaDevices.getUserMedia(c); s.getTracks().forEach(t => t.stop()); break; } catch {}
    }
    media();
  };

  let raf;
  const pads = () => {
    const list = [...(navigator.getGamepads?.() || [])].filter(Boolean);
    if (list.length) $("#pads").innerHTML = list.map(p => li(p.id, `Nr. ${p.index} · ${p.buttons.length} Tasten · ${p.axes.length} Achsen · Mapping: ${esc(p.mapping || "–")}<br>Gedrückt: ${esc(p.buttons.map((b, i) => b.pressed ? i : null).filter(v => v != null).join(", ") || "–")} · Achsen: ${esc(p.axes.map(a => a.toFixed(2)).join(" "))}${p.vibrationActuator ? " · Vibration" : ""}`)).join("");
    raf = requestAnimationFrame(pads);
  };
  if (has.gamepad) { raf = requestAnimationFrame(pads); onLeave(() => cancelAnimationFrame(raf)); }

  async function usb() {
    if (!has.usb) return;
    const d = await navigator.usb.getDevices();
    $("#usb").innerHTML = d.length ? d.map(x => li(x.productName || "Unbekanntes Gerät", `${esc(x.manufacturerName || "")} · VID ${hex4(x.vendorId)} · PID ${hex4(x.productId)} · USB ${x.usbVersionMajor}.${x.usbVersionMinor}${x.serialNumber ? " · SN " + esc(x.serialNumber) : ""}`)).join("") : "<p class='muted'>Noch keine freigegebenen Geräte.</p>";
  }
  async function hid() {
    if (!has.hid) return;
    const d = await navigator.hid.getDevices();
    $("#hid").innerHTML = d.length ? d.map(x => li(x.productName || "Unbekanntes Gerät", `VID ${hex4(x.vendorId)} · PID ${hex4(x.productId)} · ${x.collections.length} Collections${x.opened ? " · geöffnet" : ""}`)).join("") : "<p class='muted'>Noch keine freigegebenen Geräte.</p>";
  }
  async function serial() {
    if (!has.serial) return;
    const d = await navigator.serial.getPorts();
    $("#serial").innerHTML = d.length ? d.map((p, i) => { const x = p.getInfo(); return li("Port " + (i + 1), x.usbVendorId ? `VID ${hex4(x.usbVendorId)} · PID ${hex4(x.usbProductId)}` : x.bluetoothServiceClassId ? "Bluetooth: " + esc(x.bluetoothServiceClassId) : "Keine Details"); }).join("") : "<p class='muted'>Noch keine freigegebenen Geräte.</p>";
  }
  const btDevs = [];
  async function bt() {
    if (!has.bt) return;
    let avail = null; try { avail = await navigator.bluetooth.getAvailability(); } catch {}
    let d = btDevs; try { if (navigator.bluetooth.getDevices) d = await navigator.bluetooth.getDevices(); } catch {}
    $("#bt").innerHTML = (avail === false ? "<p class='muted'>Bluetooth ist aus oder kein Adapter vorhanden.</p>" : "") + (d.length ? d.map(x => li(x.name || "Unbenannt", "ID " + esc(x.id) + (x.gatt?.connected ? " · verbunden" : ""))).join("") : "<p class='muted'>Noch keine freigegebenen Geräte.</p>");
  }
  usb(); hid(); serial(); bt();
  const pick = (fn, after) => async () => { try { await fn(); } catch (e) { if (e.name !== "NotFoundError") toast(e.message); } after(); };
  $("#usbAdd").onclick = pick(() => navigator.usb.requestDevice({ filters: [] }), usb);
  $("#hidAdd").onclick = pick(() => navigator.hid.requestDevice({ filters: [] }), hid);
  $("#serialAdd").onclick = pick(() => navigator.serial.requestPort(), serial);
  $("#btAdd").onclick = pick(async () => btDevs.push(await navigator.bluetooth.requestDevice({ acceptAllDevices: true })), bt);
  const ev = [["usb", "connect", usb], ["usb", "disconnect", usb], ["hid", "connect", hid], ["hid", "disconnect", hid], ["serial", "connect", serial], ["serial", "disconnect", serial]];
  ev.forEach(([o, e, f]) => navigator[o]?.addEventListener(e, f));
  onLeave(() => ev.forEach(([o, e, f]) => navigator[o]?.removeEventListener(e, f)));
}

viewGeraete($("#app"));
})();
</script>
</body>
</html>
