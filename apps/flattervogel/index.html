<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flattervogel · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Systemtools">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats>div{flex:1;min-width:0;background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center}
.stats b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;user-select:none;-webkit-user-select:none}
.ctl.c2{grid-template-columns:1fr 1fr}
.ctl button{min-height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--text);touch-action:manipulation}
.ctl button.ac{background:var(--accent);color:var(--on-accent)}
.ctl button.tonal,.ctl button:active{background:var(--accent-soft)}
.ctl button.ac:active{background:color-mix(in srgb,var(--accent) 85%,var(--text))}
.ctl button:disabled{opacity:.5;cursor:default}
.msg{text-align:center;min-height:1.5em;margin:0 0 8px;font-weight:600}
.center{text-align:center}
.board{margin:0 auto 12px;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
#cv{display:block;border-radius:12px;cursor:pointer;touch-action:none}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Flattervogel</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
  <div class="chips" id="fMode"><button data-m="0">Entspannt</button><button data-m="1">Normal</button></div>
  <div class="stats"><div><b id="fScore">0</b><span>Punkte</span></div><div><b id="fBest">0</b><span>Rekord</span></div></div>
  <div class="board" id="fBoard"><canvas id="cv" aria-label="Spielfeld"></canvas></div>
  <p class="muted help" style="font-size:14px">Tippe aufs Spielfeld (oder Leertaste), damit der Vogel nach oben flattert. Fliege durch die Lücken zwischen den Säulen. „Entspannt“ hat größere Lücken und ist langsamer.</p>
</main>
<script>
(function () {
"use strict";
/* =========================================================
   Flattervogel – Spielwelt 320 × 460 Einheiten, feste Schrittweite für gleiches Verhalten auf langsamen Geräten
   ========================================================= */
const WW = 320, WH = 460, GROUND = 50, BX = 86, BR = 11, PIPEW = 54, STEP = 1 / 120;
const MODES = [{ gap: 150, speed: 115, grav: 1250, flap: -380, space: 200 }, { gap: 128, speed: 140, grav: 1450, flap: -420, space: 180 }];
const FONT = "system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
const cv = $("#cv"), ctx = cv.getContext("2d"), board = $("#fBoard");
let sc = 1, mode = store.get("flap.mode", 0);
if (!MODES[mode]) mode = 0;
const best = store.get("flap.best", [0, 0]);
let by, vy, pipes, score, state, acc = 0, last = 0, tAll = 0, deadAt = 0, loopOn = false, rafId = 0, idleT = 0;
onLeave(() => { cancelAnimationFrame(rafId); clearTimeout(idleT); });
const M = () => MODES[mode];
const isDark = () => document.documentElement.dataset.dark === "1";

function reset() { by = WH / 2 - 40; vy = 0; pipes = []; score = 0; state = "ready"; tAll = 0; hud(); }
function hud() {
  $("#fScore").textContent = score; $("#fBest").textContent = best[mode] || 0;
  $$("#fMode button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.m === mode));
}
function addPipe(x) {
  const m = M(), min = 70 + m.gap / 2, max = WH - GROUND - 50 - m.gap / 2;
  pipes.push({ x, cy: min + rnd(Math.max(1, Math.round(max - min))), done: false });
}
function flap() {
  if (state === "dead") { if (Date.now() - deadAt > 600) { reset(); draw(); } return; }
  if (state === "ready") { state = "run"; addPipe(WW + 40); loop(); }
  vy = M().flap;
}
function loop() { if (!loopOn) { loopOn = true; last = 0; acc = 0; rafId = requestAnimationFrame(frame); } }
function frame(t) {
  const dt = last ? Math.min(0.1, (t - last) / 1000) : STEP;
  last = t; acc += dt;
  while (acc >= STEP && state === "run") { update(STEP); acc -= STEP; }
  draw();
  if (state === "run") rafId = requestAnimationFrame(frame); else loopOn = false;
}
function hitRect(x, y, w, h) {
  const nx = Math.max(x, Math.min(BX, x + w)), ny = Math.max(y, Math.min(by, y + h));
  return (BX - nx) ** 2 + (by - ny) ** 2 < BR * BR;
}
function update(dt) {
  const m = M();
  tAll += dt;
  vy += m.grav * dt; by += vy * dt;
  if (by < BR) { by = BR; vy = 0; }
  for (const p of pipes) {
    p.x -= m.speed * dt;
    if (!p.done && p.x + PIPEW < BX - BR) { p.done = true; score++; hud(); }
    /* Kreis gegen Säulen und ihre etwas breiteren Köpfe */
    const gt = p.cy - m.gap / 2, gb = p.cy + m.gap / 2;
    if (hitRect(p.x, -50, PIPEW, gt + 50) || hitRect(p.x - 3, gt - 14, PIPEW + 6, 14) || hitRect(p.x, gb, PIPEW, WH) || hitRect(p.x - 3, gb, PIPEW + 6, 14)) { die(); return; }
  }
  if (pipes.length && pipes[0].x + PIPEW < -10) pipes.shift();
  const lastP = pipes[pipes.length - 1];
  if (!lastP || lastP.x < WW - m.space) addPipe(WW + 10);
  if (by + BR >= WH - GROUND) { by = WH - GROUND - BR; die(); }
}
function die() {
  state = "dead"; deadAt = Date.now();
  if (score > (best[mode] || 0)) { best[mode] = score; store.set("flap.best", best); toast("Neuer Rekord!"); }
  hud();
}
function draw() {
  const m = M(), off = (tAll * m.speed) % 24;
  ctx.fillStyle = isDark() ? "#16324a" : "#bfe3f5"; ctx.fillRect(0, 0, WW, WH);
  for (const p of pipes) {
    ctx.fillStyle = "#3f9a3f";
    ctx.fillRect(p.x, 0, PIPEW, p.cy - m.gap / 2);
    ctx.fillRect(p.x, p.cy + m.gap / 2, PIPEW, WH - GROUND - p.cy - m.gap / 2);
    ctx.fillStyle = "#2f7a2f";
    ctx.fillRect(p.x - 3, p.cy - m.gap / 2 - 14, PIPEW + 6, 14);
    ctx.fillRect(p.x - 3, p.cy + m.gap / 2, PIPEW + 6, 14);
  }
  ctx.fillStyle = "#c9a35a"; ctx.fillRect(0, WH - GROUND, WW, GROUND);
  ctx.fillStyle = "#7cb342"; ctx.fillRect(0, WH - GROUND, WW, 8);
  ctx.fillStyle = "#b08a45";
  for (let i = -1; i < WW / 24 + 1; i++) ctx.fillRect(i * 24 - off, WH - GROUND + 18, 12, 4);
  const y = state === "ready" ? by + Math.sin(Date.now() / 200) * 4 : by;
  const ang = state === "ready" ? 0 : Math.max(-0.5, Math.min(1.2, vy / 600));
  ctx.save(); ctx.translate(BX, y); ctx.rotate(ang);
  ctx.fillStyle = "#f4c430"; ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e0a020"; ctx.beginPath(); ctx.arc(-3, 3, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(4, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#111111"; ctx.beginPath(); ctx.arc(5, -4, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ee7a22"; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(17, 3); ctx.lineTo(9, 6); ctx.fill();
  ctx.restore();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (state === "run" || state === "dead") {
    ctx.font = "700 40px " + FONT;
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillText(score, WW / 2 + 2, 62);
    ctx.fillStyle = "#ffffff"; ctx.fillText(score, WW / 2, 60);
  }
  if (state !== "run") {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, WH / 2 + 30, WW, 46);
    ctx.fillStyle = "#ffffff"; ctx.font = "600 17px " + FONT;
    ctx.fillText(state === "ready" ? "Tippe zum Losfliegen" : "Vorbei! Tippe für eine neue Runde", WW / 2, WH / 2 + 53);
  }
}
/* Bereit-Zustand: sanftes Schweben ohne Dauer-Schleife, wenn die Seite verdeckt ist */
function idle() { if (state === "ready" && !document.hidden) draw(); idleT = setTimeout(idle, 50); }
function size() {
  const W = fitWidth(400, WH / WW, board), r = devicePixelRatio || 1;
  sc = W / WW;
  cv.style.width = W + "px"; cv.style.height = Math.round(WH * sc) + "px"; board.style.width = W + "px";
  cv.width = Math.round(W * r); cv.height = Math.round(WH * sc * r);
  ctx.setTransform(sc * r, 0, 0, sc * r, 0, 0);
  draw();
}
onPress(cv, flap);
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W") { if (e.key === " " && e.target.closest?.("button")) return; e.preventDefault(); flap(); }
});
$("#fMode").onclick = e => {
  const b = e.target.closest("button"); if (!b || state === "run") return;
  mode = +b.dataset.m; store.set("flap.mode", mode); reset(); draw();
};
addEventListener("resize", size);
reset(); size(); idle();
})();
</script>
</body>
</html>
