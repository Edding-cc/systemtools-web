<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einheitenrechner · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
/* Gemeinsame Bausteine der Apps */
input[type=tel],input[type=password],input[type=search]{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none;width:100%}
.flex{display:flex;align-items:center;gap:8px}
.flex>.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.center{text-align:center}
.between{justify-content:space-between}
.ok{color:var(--ok)}
.result{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:12px;overflow-wrap:anywhere}
.result .big{font-size:34px}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}
.stats>div{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.stats b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.ctl.c2{--n:2}.ctl.c4{--n:4}
.ctl button{height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:0 4px;touch-action:none}
.ctl button.ac{background:var(--accent);color:var(--on-accent)}
.ctl button.tonal{background:var(--accent-soft)}
.ctl button:disabled{opacity:.5;cursor:default}
.ctl button.down,.ctl button:active:not(:disabled),.btn.down{box-shadow:inset 0 0 0 100px color-mix(in srgb,currentColor 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 8px 6px 0}
.tbl td{padding:6px 8px 6px 0;vertical-align:top;border-top:1px solid var(--border);overflow-wrap:anywhere}
.tbl tr:first-child td{border-top:0}
.timebig{font-size:56px;font-weight:700;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
@media (max-width:380px){.timebig{font-size:46px}}
/* Seite */
#uRes{font-size:30px;word-break:break-all}
#uFrom,#uTo{min-width:0}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Einheitenrechner</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
<div class="card">
<label class="fld" for="uCat">Kategorie</label><select id="uCat"></select>
<label class="fld" for="uVal">Wert</label><input type="text" inputmode="decimal" autocomplete="off" id="uVal" class="mono" value="1">
<div class="flex mt"><select id="uFrom" class="grow" aria-label="Von"></select><button class="btn tonal" id="uSwap" aria-label="Tauschen">⇄</button><select id="uTo" class="grow" aria-label="Nach"></select></div>
<div class="result center"><div class="big mono" id="uRes">–</div><div class="muted" id="uResL"></div></div>
<div class="row mt"><button class="btn tonal" id="uCopy">Ergebnis kopieren</button></div>
</div>
<div class="card"><h3>Alle Einheiten</h3><table class="tbl" id="uAll"></table></div>
</main>
<script>
(function () {
"use strict";
/* =========================================================
   Einheitenrechner
   ========================================================= */
/* "1.234,5" oder "1234.5" -> Zahl, sonst NaN */
function parseNum(v) {
  v = String(v ?? "").replace(/[\s ']/g, "");
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  return /^[+\-]?(\d+\.?\d*|\.\d+)(e[+\-]?\d+)?$/i.test(v) ? parseFloat(v) : NaN;
}
/* Zahl mit bis zu sig signifikanten Stellen, deutsch formatiert (sehr groß/klein: 1,23e-9) */
function fmtG(v, sig = 10) {
  v = Number(v);
  if (!isFinite(v)) return "–";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 1e15 || a < 1e-6) return v.toExponential(sig - 1).replace(/\.?0+e/, "e").replace(".", ",");
  let str = String(Number(v.toPrecision(sig)));
  if (/e/i.test(str)) str = Number(str).toFixed(12).replace(/0+$/, "");
  const p = str.replace("-", "").split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (v < 0 ? "-" : "") + p[0] + (p[1] ? "," + p[1] : "");
}
/* Faktor = Wert der Einheit in der Basiseinheit der Kategorie */
const CATS = [
  { n: "Länge", u: [["mm", "Millimeter", 0.001], ["cm", "Zentimeter", 0.01], ["m", "Meter", 1], ["km", "Kilometer", 1000], ["in", "Zoll (inch)", 0.0254], ["ft", "Fuß (foot)", 0.3048], ["yd", "Yard", 0.9144], ["mi", "Meile", 1609.344], ["sm", "Seemeile", 1852]] },
  { n: "Masse / Gewicht", u: [["mg", "Milligramm", 1e-6], ["g", "Gramm", 0.001], ["kg", "Kilogramm", 1], ["t", "Tonne", 1000], ["oz", "Unze (avdp.)", 0.028349523125], ["lb", "Pfund (lb)", 0.45359237], ["st", "Stone", 6.35029318]] },
  { n: "Temperatur", u: [["°C", "Grad Celsius", "C"], ["°F", "Grad Fahrenheit", "F"], ["K", "Kelvin", "K"]] },
  { n: "Fläche", u: [["mm²", "Quadratmillimeter", 1e-6], ["cm²", "Quadratzentimeter", 1e-4], ["m²", "Quadratmeter", 1], ["a", "Ar", 100], ["ha", "Hektar", 1e4], ["km²", "Quadratkilometer", 1e6], ["ft²", "Quadratfuß", 0.09290304], ["ac", "Acre", 4046.8564224], ["mi²", "Quadratmeile", 2589988.110336]] },
  { n: "Volumen", u: [["ml", "Milliliter", 0.001], ["cl", "Zentiliter", 0.01], ["dl", "Deziliter", 0.1], ["l", "Liter", 1], ["m³", "Kubikmeter", 1000], ["fl oz", "US-Flüssigunze", 0.0295735295625], ["gal", "US-Gallone", 3.785411784], ["imp gal", "Imperiale Gallone", 4.54609], ["bbl", "Barrel (Öl)", 158.987294928]] },
  { n: "Geschwindigkeit", u: [["m/s", "Meter pro Sekunde", 1], ["km/h", "Kilometer pro Stunde", 1 / 3.6], ["mph", "Meilen pro Stunde", 0.44704], ["kn", "Knoten", 1852 / 3600], ["ft/s", "Fuß pro Sekunde", 0.3048]] },
  { n: "Zeit", u: [["ms", "Millisekunden", 0.001], ["s", "Sekunden", 1], ["min", "Minuten", 60], ["h", "Stunden", 3600], ["d", "Tage", 86400], ["Wo", "Wochen", 604800], ["J", "Jahre (365 Tage)", 31536000]] },
  { n: "Datenmenge", u: [["bit", "Bit", 0.125], ["B", "Byte", 1], ["kB", "Kilobyte (1000)", 1e3], ["MB", "Megabyte", 1e6], ["GB", "Gigabyte", 1e9], ["TB", "Terabyte", 1e12], ["KiB", "Kibibyte (1024)", 1024], ["MiB", "Mebibyte", 1048576], ["GiB", "Gibibyte", 1073741824], ["TiB", "Tebibyte", 1099511627776]] },
  { n: "Datenrate", u: [["bit/s", "Bit pro Sekunde", 1], ["kbit/s", "Kilobit pro Sekunde", 1e3], ["Mbit/s", "Megabit pro Sekunde", 1e6], ["Gbit/s", "Gigabit pro Sekunde", 1e9], ["kB/s", "Kilobyte pro Sekunde", 8e3], ["MB/s", "Megabyte pro Sekunde", 8e6], ["MiB/s", "Mebibyte pro Sekunde", 8388608]] },
  { n: "Druck", u: [["Pa", "Pascal", 1], ["hPa", "Hektopascal", 100], ["kPa", "Kilopascal", 1000], ["bar", "Bar", 1e5], ["mbar", "Millibar", 100], ["psi", "Pfund pro Quadratzoll", 6894.757293168], ["atm", "Physikalische Atmosphäre", 101325], ["mmHg", "Millimeter Quecksilbersäule", 133.322387415]] },
  { n: "Energie", u: [["J", "Joule", 1], ["kJ", "Kilojoule", 1000], ["cal", "Kalorie (thermochem.)", 4.184], ["kcal", "Kilokalorie", 4184], ["Wh", "Wattstunde", 3600], ["kWh", "Kilowattstunde", 3.6e6], ["eV", "Elektronenvolt", 1.602176634e-19]] },
  { n: "Leistung", u: [["W", "Watt", 1], ["kW", "Kilowatt", 1000], ["MW", "Megawatt", 1e6], ["PS", "Pferdestärke (metrisch)", 735.49875], ["hp", "Horsepower (mech.)", 745.69987158227]] },
  { n: "Winkel", u: [["°", "Grad", 1], ["rad", "Radiant", 180 / Math.PI], ["gon", "Gon", 0.9], ["′", "Bogenminute", 1 / 60], ["″", "Bogensekunde", 1 / 3600]] }
];
const cfg = Object.assign({ c: 0, f: 2, t: 3 }, store.get("units", {}));
function toBase(c, i, v) {
  const f = CATS[c].u[i][2];
  if (f === "C") return v; if (f === "F") return (v - 32) * 5 / 9; if (f === "K") return v - 273.15;
  return v * f;
}
function fromBase(c, i, v) {
  const f = CATS[c].u[i][2];
  if (f === "C") return v; if (f === "F") return v * 9 / 5 + 32; if (f === "K") return v + 273.15;
  return v / f;
}
function fillUnits() {
  const u = CATS[cfg.c].u, h = u.map((x, i) => `<option value="${i}">${esc(x[0] + " – " + x[1])}</option>`).join("");
  $("#uFrom").innerHTML = h; $("#uTo").innerHTML = h;
  if (!(cfg.f < u.length)) cfg.f = 0; if (!(cfg.t < u.length)) cfg.t = Math.min(1, u.length - 1);
  $("#uFrom").value = cfg.f; $("#uTo").value = cfg.t;
}
function calc() {
  const v = parseNum($("#uVal").value), u = CATS[cfg.c].u;
  store.set("units", cfg);
  if (isNaN(v)) { $("#uRes").textContent = "–"; $("#uResL").textContent = "Zahl eingeben"; $("#uAll").innerHTML = ""; return; }
  const base = toBase(cfg.c, cfg.f, v);
  $("#uRes").textContent = fmtG(fromBase(cfg.c, cfg.t, base)) + " " + u[cfg.t][0];
  $("#uResL").textContent = fmtG(v) + " " + u[cfg.f][0] + " =";
  $("#uAll").innerHTML = u.map((x, i) => `<tr><td>${esc(x[1])}</td><td class="mono" style="text-align:right">${fmtG(fromBase(cfg.c, i, base))} ${esc(x[0])}</td></tr>`).join("");
}
$("#uCat").innerHTML = CATS.map((c, i) => `<option value="${i}">${esc(c.n)}</option>`).join("");
if (!CATS[cfg.c]) cfg.c = 0;
$("#uCat").value = cfg.c;
$("#uCat").onchange = e => { cfg.c = +e.target.value; cfg.f = 0; cfg.t = 1; fillUnits(); calc(); };
$("#uFrom").onchange = e => { cfg.f = +e.target.value; calc(); };
$("#uTo").onchange = e => { cfg.t = +e.target.value; calc(); };
$("#uVal").oninput = calc;
$("#uSwap").onclick = () => { [cfg.f, cfg.t] = [cfg.t, cfg.f]; $("#uFrom").value = cfg.f; $("#uTo").value = cfg.t; calc(); };
$("#uCopy").onclick = () => { if ($("#uRes").textContent !== "–") copy($("#uRes").textContent); };
fillUnits(); calc();
})();
</script>
</body>
</html>
