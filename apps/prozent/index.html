<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prozentrechner · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Systemtools">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
/* Gemeinsame Bausteine der Apps */
input[type=tel],input[type=password],input[type=search]{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none;width:100%}
.flex{display:flex;align-items:center;gap:8px}
.flex>.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.center{text-align:center}
.between{justify-content:space-between}
.ok{color:var(--ok)}
.result{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:12px;overflow-wrap:anywhere}
.result .big{font-size:34px}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}
.stats>div{background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.stats b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;margin-bottom:12px;user-select:none;-webkit-user-select:none}
.ctl.c2{--n:2}.ctl.c4{--n:4}
.ctl button{height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:0 4px;touch-action:none}
.ctl button.ac{background:var(--accent);color:var(--on-accent)}
.ctl button.tonal{background:var(--accent-soft)}
.ctl button:disabled{opacity:.5;cursor:default}
.ctl button.down,.ctl button:active:not(:disabled),.btn.down{box-shadow:inset 0 0 0 100px color-mix(in srgb,currentColor 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 8px 6px 0}
.tbl td{padding:6px 8px 6px 0;vertical-align:top;border-top:1px solid var(--border);overflow-wrap:anywhere}
.tbl tr:first-child td{border-top:0}
.timebig{font-size:56px;font-weight:700;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
@media (max-width:380px){.timebig{font-size:46px}}
/* Seite */
.pc .grid2 input{font-family:var(--mono)}
.pc .grid2{gap:0 12px}
.pc .result{margin-top:10px;padding:8px 12px}
.pc .result b{font-size:22px;font-variant-numeric:tabular-nums}
.pc .chips{margin-bottom:2px}
@media (max-width:520px){.pc .grid2{grid-template-columns:1fr 1fr}}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Prozentrechner</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
<div class="pc">
<div class="card"><h3>Prozentwert: p % von G</h3>
<div class="grid2"><div><label class="fld" for="a1">p (%)</label><input type="text" inputmode="decimal" autocomplete="off" id="a1" data-k="a1"></div><div><label class="fld" for="a2">G (Grundwert)</label><input type="text" inputmode="decimal" autocomplete="off" id="a2" data-k="a2"></div></div>
<div class="result" id="ra"></div></div>
<div class="card"><h3>Prozentsatz: W ist wie viel % von G?</h3>
<div class="grid2"><div><label class="fld" for="b1">W (Anteil)</label><input type="text" inputmode="decimal" autocomplete="off" id="b1" data-k="b1"></div><div><label class="fld" for="b2">G (Grundwert)</label><input type="text" inputmode="decimal" autocomplete="off" id="b2" data-k="b2"></div></div>
<div class="result" id="rb"></div></div>
<div class="card"><h3>Grundwert: W sind p %, wie viel sind 100 %?</h3>
<div class="grid2"><div><label class="fld" for="c1">W (Anteil)</label><input type="text" inputmode="decimal" autocomplete="off" id="c1" data-k="c1"></div><div><label class="fld" for="c2">p (%)</label><input type="text" inputmode="decimal" autocomplete="off" id="c2" data-k="c2"></div></div>
<div class="result" id="rc"></div></div>
<div class="card"><h3>Veränderung von A nach B</h3>
<div class="grid2"><div><label class="fld" for="d1">A (alt)</label><input type="text" inputmode="decimal" autocomplete="off" id="d1" data-k="d1"></div><div><label class="fld" for="d2">B (neu)</label><input type="text" inputmode="decimal" autocomplete="off" id="d2" data-k="d2"></div></div>
<div class="result" id="rd"></div></div>
<div class="card"><h3>Auf- und Abschlag: G ± p %</h3>
<div class="grid2"><div><label class="fld" for="e1">G (Grundwert)</label><input type="text" inputmode="decimal" autocomplete="off" id="e1" data-k="e1"></div><div><label class="fld" for="e2">p (%)</label><input type="text" inputmode="decimal" autocomplete="off" id="e2" data-k="e2"></div></div>
<div class="result" id="re"></div></div>
<div class="card"><h3>Mehrwertsteuer</h3>
<div class="chips" id="vRate"><button data-r="19">19 %</button><button data-r="7">7 %</button><button data-r="0">eigener Satz</button></div>
<div class="grid2"><div><label class="fld" for="f1">Betrag</label><input type="text" inputmode="decimal" autocomplete="off" id="f1" data-k="f1"></div><div><label class="fld" for="f2">Steuersatz (%)</label><input type="text" inputmode="decimal" autocomplete="off" id="f2" data-k="f2"></div></div>
<div class="seg mt" id="vDir" role="group"><button data-d="net">Betrag ist netto</button><button data-d="gross">Betrag ist brutto</button></div>
<div class="result" id="rf"></div></div>
<p class="muted" style="font-size:13px">19 % und 7 % sind der Regel- und der ermäßigte Satz in Deutschland. Angaben ohne Gewähr.</p>
</div>
</main>
<script>
(function () {
"use strict";
/* =========================================================
   Prozentrechner
   ========================================================= */
/* "1.234,5" oder "1234.5" -> Zahl, sonst NaN */
function parseNum(v) {
  v = String(v ?? "").replace(/[\s ']/g, "");
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  return /^[+\-]?(\d+\.?\d*|\.\d+)(e[+\-]?\d+)?$/i.test(v) ? parseFloat(v) : NaN;
}
/* Zahl mit bis zu sig signifikanten Stellen, deutsch formatiert (sehr groß/klein: 1,23e-9) */
function fmtG(v, sig = 10) {
  v = Number(v);
  if (!isFinite(v)) return "–";
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 1e15 || a < 1e-6) return v.toExponential(sig - 1).replace(/\.?0+e/, "e").replace(".", ",");
  let str = String(Number(v.toPrecision(sig)));
  if (/e/i.test(str)) str = Number(str).toFixed(12).replace(/0+$/, "");
  const p = str.replace("-", "").split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (v < 0 ? "-" : "") + p[0] + (p[1] ? "," + p[1] : "");
}
const v = Object.assign({ f2: "19", dir: "net" }, store.get("pct", {}));
const n = k => parseNum(v[k]);
const out = (id, html) => $("#" + id).innerHTML = html || '<span class="muted">Werte eingeben</span>';
const ok = (...a) => a.every(x => !isNaN(x));
const sign = (a, b) => b >= a ? "+" : "";
function calc() {
  const [a1, a2, b1, b2, c1, c2, d1, d2, e1, e2, f1, f2] = ["a1", "a2", "b1", "b2", "c1", "c2", "d1", "d2", "e1", "e2", "f1", "f2"].map(n);
  out("ra", ok(a1, a2) ? `<b>${fmtG(a2 * a1 / 100)}</b> <span class="muted">(${fmtG(a1)} % von ${fmtG(a2)})</span>` : "");
  out("rb", ok(b1, b2) ? (b2 === 0 ? '<span class="err">G darf nicht 0 sein</span>' : `<b>${fmtG(b1 / b2 * 100)} %</b>`) : "");
  out("rc", ok(c1, c2) ? (c2 === 0 ? '<span class="err">p darf nicht 0 sein</span>' : `<b>${fmtG(c1 * 100 / c2)}</b> <span class="muted">= 100 %</span>`) : "");
  out("rd", ok(d1, d2) ? (d1 === 0 ? '<span class="err">A darf nicht 0 sein</span>' : `<b>${sign(d1, d2)}${fmtG((d2 - d1) / Math.abs(d1) * 100)} %</b> <span class="muted">(Differenz ${sign(d1, d2)}${fmtG(d2 - d1)})</span>`) : "");
  out("re", ok(e1, e2) ? `+ ${fmtG(e2)} %: <b>${fmtG(e1 * (1 + e2 / 100))}</b><br>− ${fmtG(e2)} %: <b>${fmtG(e1 * (1 - e2 / 100))}</b>` : "");
  if (ok(f1, f2)) {
    const net = v.dir === "net" ? f1 : f1 / (1 + f2 / 100), tax = net * f2 / 100;
    out("rf", `Netto: <b>${nf(net, 2)}</b><br>MwSt ${fmtG(f2)} %: <b>${nf(tax, 2)}</b><br>Brutto: <b>${nf(net + tax, 2)}</b>`);
  } else out("rf", "");
  $$("#vRate button").forEach(b => { const r = b.dataset.r; b.setAttribute("aria-pressed", r === "0" ? !["19", "7"].includes(String(v.f2)) : r === String(v.f2)); });
  $$("#vDir button").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === v.dir));
  store.set("pct", v);
}
$$(".pc input[data-k]").forEach(inp => {
  inp.value = v[inp.dataset.k] || "";
  inp.oninput = () => { v[inp.dataset.k] = inp.value; calc(); };
});
$("#vRate").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const r = b.dataset.r;
  if (r === "0") { $("#f2").focus(); $("#f2").select(); return; }
  v.f2 = r; $("#f2").value = r; calc();
};
$("#vDir").onclick = e => { const b = e.target.closest("button"); if (b) { v.dir = b.dataset.d; calc(); } };
calc();
})();
</script>
</body>
</html>
