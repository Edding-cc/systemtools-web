<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats>div{flex:1;min-width:0;background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center}
.stats b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 auto 8px;max-width:440px;user-select:none;-webkit-user-select:none}
.ctl.c5{grid-template-columns:repeat(5,1fr)}
.ctl button{min-height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--surface-2);touch-action:manipulation}
.ctl.c5 button{font-size:22px;touch-action:none}
.ctl:not(.c5) button{font-size:16px;padding:0 6px}
.ctl button.ac{background:var(--accent);color:var(--on-accent)}
.ctl button.tonal{background:var(--accent-soft)}
.ctl button.down:not(.ac){background:var(--accent-soft)}
.msg{text-align:center;min-height:1.5em;margin:0 0 8px;font-weight:600}
#sg{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,440px);margin:0 auto 12px;border:2px solid var(--muted);container-type:inline-size;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#sg div.c{aspect-ratio:1;display:grid;place-items:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);color:var(--accent);font-weight:600;font-size:6.4cqw;cursor:pointer;overflow:hidden;font-variant-numeric:tabular-nums}
:root[data-dark="1"] #sg div.c{color:color-mix(in srgb,var(--accent) 45%,#fff)}
#sg div.c:nth-child(9n){border-right:0}
#sg div.c:nth-child(n+73){border-bottom:0}
#sg div.b3{border-right:2px solid var(--muted)}
#sg div.r3{border-bottom:2px solid var(--muted)}
#sg div.g,:root[data-dark="1"] #sg div.g{color:var(--text);font-weight:700}
#sg div.same{background:var(--surface-2)}
#sg div.sel{background:var(--accent-soft)}
#sg div.bad,:root[data-dark="1"] #sg div.bad{color:var(--err)}
#sg .nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%}
#sg .nt i{font-style:normal;font-weight:400;display:grid;place-items:center;color:var(--muted);font-size:max(8px,2.9cqw);line-height:1}
.card .switch{padding:0}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Sudoku</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
  <div class="chips" id="sLvl"><button data-l="0">Leicht</button><button data-l="1">Mittel</button><button data-l="2">Schwer</button></div>
  <div class="stats"><div><b id="sTime">00:00</b><span>Zeit</span></div><div><b id="sLeft">–</b><span>Offen</span></div><div><b id="sErr">0</b><span>Fehler</span></div><div><b id="sBest">–</b><span>Bestzeit</span></div></div>
  <div id="sg" role="grid" aria-label="Sudoku-Feld"></div>
  <p class="msg" id="sMsg" role="status"></p>
  <div class="ctl c5" id="sPad2"></div>
  <div class="ctl"><button id="sNotes" class="tonal" aria-pressed="false">Notizen: aus</button><button id="sHint" class="tonal">Tipp</button><button id="sNew" class="ac">Neu</button></div>
  <div class="card"><label class="switch"><span>Fehler sofort markieren</span><input type="checkbox" id="sShowErr"></label></div>
  <p class="muted" style="font-size:14px">Feld antippen, dann Zahl wählen. Im Notizenmodus werden kleine Kandidaten gesetzt. Tastatur: Ziffern, Pfeiltasten, Entf/Rücktaste löscht, N schaltet Notizen um. Das Rätsel bleibt gespeichert.</p>
</main>
<script>
(function () {
"use strict";
/* =========================================================
   Sudoku
   ========================================================= */
const rnd = n => { const lim = 2 ** 32 - (2 ** 32 % n), a = new Uint32Array(1); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isTyping = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName) || e.target?.isContentEditable;
const pad = n => String(n).padStart(2, "0");
const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s % 60); };
function onPress(el, fn) {
  el.addEventListener("pointerdown", e => { if (e.button > 0) return; e.preventDefault(); el.classList.add("down"); fn(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, () => el.classList.remove("down")));
  el.addEventListener("click", e => { if (e.detail === 0) fn(); });
}

const GIVENS = [38, 31, 26];
let st = store.get("sudoku", null), sel = -1, notesMode = false, showErr = store.get("sudoku.err", true), tmr = 0;
let lvl = store.get("sudoku.lvl", 1); if (!GIVENS[lvl]) lvl = 1;
onLeave(() => { clearInterval(tmr); if (st) save(); });

/* ---------- Löser mit Bitmasken (zählt Lösungen bis limit) ---------- */
const BOX = Array.from({ length: 81 }, (_, i) => Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor(i % 9 / 3));
const bits = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
function solve(g, limit, randomize) {
  const R = Array(9).fill(0), C = Array(9).fill(0), B = Array(9).fill(0);
  let count = 0;
  for (let i = 0; i < 81; i++) {
    const v = g[i]; if (!v) continue;
    const b = 1 << v;
    if ((R[Math.floor(i / 9)] | C[i % 9] | B[BOX[i]]) & b) return 0;
    R[Math.floor(i / 9)] |= b; C[i % 9] |= b; B[BOX[i]] |= b;
  }
  function rec() {
    let best = -1, bestMask = 0, bestN = 10;
    for (let k = 0; k < 81; k++) {
      if (g[k]) continue;
      const m = ~(R[Math.floor(k / 9)] | C[k % 9] | B[BOX[k]]) & 0x3FE, n = bits(m);
      if (n < bestN) { best = k; bestMask = m; bestN = n; if (n <= 1) break; }
    }
    if (best < 0) { count++; return count >= limit; }
    if (!bestN) return false;
    const cand = [];
    for (let d = 1; d <= 9; d++) if (bestMask & (1 << d)) cand.push(d);
    if (randomize) shuffle(cand);
    const r = Math.floor(best / 9), c = best % 9, bx = BOX[best];
    for (const d of cand) {
      const bb = 1 << d;
      g[best] = d; R[r] |= bb; C[c] |= bb; B[bx] |= bb;
      if (rec()) return true;
      R[r] &= ~bb; C[c] &= ~bb; B[bx] &= ~bb;
    }
    g[best] = 0;
    return false;
  }
  rec();
  return count;
}
function generate(level) {
  const sol = Array(81).fill(0);
  solve(sol, 1, true);
  const puz = sol.slice(), order = shuffle(Array.from({ length: 81 }, (_, i) => i));
  let left = 81;
  for (let i = 0; i < 81 && left > GIVENS[level]; i++) {
    const k = order[i], keep = puz[k];
    puz[k] = 0;
    if (solve(puz.slice(), 2, false) !== 1) puz[k] = keep; else left--;
  }
  return { p: puz, s: sol };
}

/* ---------- Spiel ---------- */
function newGame() {
  $("#sMsg").textContent = "Erzeuge Rätsel …";
  setTimeout(() => {
    const g = generate(lvl);
    st = { p: g.p, s: g.s, v: g.p.slice(), n: Array(81).fill(0), lvl, t: 0, err: 0, done: false };
    sel = -1; save(); render(); $("#sMsg").textContent = ""; startClock();
  }, 30);
}
const save = () => store.set("sudoku", st);
function build() {
  $("#sg").innerHTML = Array.from({ length: 81 }, (_, i) => {
    const c = i % 9, r = Math.floor(i / 9);
    return `<div class="c" role="gridcell" data-i="${i}" aria-label="Zeile ${r + 1}, Spalte ${c + 1}"></div>`;
  }).join("");
}
const borderCls = i => (i % 9 % 3 === 2 && i % 9 < 8 ? "b3 " : "") + (Math.floor(i / 9) % 3 === 2 && i < 72 ? "r3 " : "");
function render() {
  const els = $$("#sg .c"), sv = sel >= 0 ? st.v[sel] : 0;
  let open = 0;
  for (let i = 0; i < 81; i++) {
    const v = st.v[i]; if (!v) open++;
    let cls = "c " + borderCls(i);
    if (st.p[i]) cls += "g ";
    if (i === sel) cls += "sel ";
    else if (sel >= 0 && (sv ? v === sv : (Math.floor(i / 9) === Math.floor(sel / 9) || i % 9 === sel % 9 || BOX[i] === BOX[sel]))) cls += "same ";
    if (v && showErr && !st.p[i] && v !== st.s[i]) cls += "bad";
    els[i].className = cls;
    if (v) els[i].textContent = v;
    else if (st.n[i]) {
      let h = '<div class="nt">';
      for (let d = 1; d <= 9; d++) h += "<i>" + (st.n[i] & (1 << d) ? d : "") + "</i>";
      els[i].innerHTML = h + "</div>";
    } else els[i].textContent = "";
  }
  $("#sLeft").textContent = open; $("#sErr").textContent = st.err;
  $("#sTime").textContent = fmtDur(st.t);
  const bk = store.get("sudoku.best", {});
  $("#sBest").textContent = bk[lvl] ? fmtDur(bk[lvl]) : "–";
  $$("#sLvl button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.l === lvl));
  $("#sShowErr").checked = showErr;
  const nb = $("#sNotes");
  nb.textContent = "Notizen: " + (notesMode ? "an" : "aus"); nb.className = notesMode ? "ac" : "tonal"; nb.setAttribute("aria-pressed", notesMode);
}
function startClock() {
  clearInterval(tmr);
  tmr = setInterval(() => {
    if (!st || st.done || document.hidden) return;
    st.t++; $("#sTime").textContent = fmtDur(st.t);
    if (st.t % 10 === 0) save();
  }, 1000);
}
function input(d) {
  if (!st || st.done || sel < 0 || st.p[sel]) return;
  if (d === 0) { st.v[sel] = 0; st.n[sel] = 0; }
  else if (notesMode) { if (!st.v[sel]) st.n[sel] ^= (1 << d); }
  else {
    st.v[sel] = st.v[sel] === d ? 0 : d;
    if (st.v[sel] && st.v[sel] !== st.s[sel]) st.err++;
    if (st.v[sel]) clearNotes(sel, d);
  }
  check(); save(); render();
}
function clearNotes(i, d) {
  for (let k = 0; k < 81; k++)
    if (Math.floor(k / 9) === Math.floor(i / 9) || k % 9 === i % 9 || BOX[k] === BOX[i]) st.n[k] &= ~(1 << d);
}
function check() {
  for (let i = 0; i < 81; i++) if (st.v[i] !== st.s[i]) return;
  st.done = true; sel = -1;
  const bk = store.get("sudoku.best", {}), rec = !bk[st.lvl] || st.t < bk[st.lvl];
  if (rec) { bk[st.lvl] = st.t; store.set("sudoku.best", bk); }
  $("#sMsg").textContent = "Gelöst in " + fmtDur(st.t) + (rec ? " – neue Bestzeit!" : "");
}

$("#sPad2").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}">${d}</button>`).join("") + '<button data-d="0" class="tonal" aria-label="Löschen">⌫</button>';
$$("#sPad2 button").forEach(b => onPress(b, () => input(+b.dataset.d)));
$("#sg").onclick = e => {
  const c = e.target.closest(".c"); if (!c || !st || st.done) return;
  sel = +c.dataset.i; render();
};
addEventListener("keydown", e => {
  if (isTyping(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^[1-9]$/.test(k)) input(+k);
  else if (k === "Backspace" || k === "Delete" || k === "0") { e.preventDefault(); input(0); }
  else if ((k === "n" || k === "N") && st && !st.done) { notesMode = !notesMode; render(); }
  else if (k.startsWith("Arrow") && st && !st.done) {
    e.preventDefault();
    if (sel < 0) sel = 40;
    else if (k === "ArrowLeft") sel = sel % 9 ? sel - 1 : sel;
    else if (k === "ArrowRight") sel = sel % 9 < 8 ? sel + 1 : sel;
    else if (k === "ArrowUp") sel = sel >= 9 ? sel - 9 : sel;
    else if (k === "ArrowDown") sel = sel < 72 ? sel + 9 : sel;
    render();
  }
});
$("#sNotes").onclick = () => { notesMode = !notesMode; if (st) render(); };
$("#sHint").onclick = () => {
  if (!st || st.done) return;
  if (sel < 0 || st.p[sel] || st.v[sel] === st.s[sel]) {
    const free = []; for (let i = 0; i < 81; i++) if (st.v[i] !== st.s[i]) free.push(i);
    if (!free.length) return;
    sel = free[rnd(free.length)];
  }
  st.v[sel] = st.s[sel]; clearNotes(sel, st.s[sel]); check(); save(); render();
};
$("#sNew").onclick = () => { if (!st || st.done || confirm("Aktuelles Rätsel verwerfen?")) newGame(); };
$("#sLvl").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  lvl = +b.dataset.l; store.set("sudoku.lvl", lvl);
  if (!st || st.done || confirm("Neues Rätsel mit diesem Schwierigkeitsgrad starten?")) newGame(); else render();
};
$("#sShowErr").onchange = e => { showErr = e.target.checked; store.set("sudoku.err", showErr); if (st) render(); };
build();
if (st && Array.isArray(st.p) && st.p.length === 81) {
  lvl = st.lvl; render(); startClock();
  if (st.done) $("#sMsg").textContent = "Gelöst – starte ein neues Rätsel.";
} else newGame();
})();
</script>
</body>
</html>
