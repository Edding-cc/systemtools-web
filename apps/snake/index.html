<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake · Systemtools</title>
<meta name="description" content="Systemtools – Werkzeuge für dein Gerät, direkt im Browser.">
<meta name="theme-color" content="#1F3A5F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%239FABBC'/%3E%3Cpath d='M30 10a8 8 0 0 0-7.6 10.4L11 31.8a3 3 0 0 0 4.2 4.2l11.4-11.4A8 8 0 0 0 37 17l-5 5-4-1-1-4 5-5a8 8 0 0 0-2-2z' fill='%231F3A5F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/style.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats>div{flex:1;min-width:0;background:var(--surface-2);border-radius:12px;padding:6px 4px;text-align:center}
.stats b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:12px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;user-select:none;-webkit-user-select:none;max-width:420px;margin-inline:auto}
.ctl button{min-height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer;background:var(--surface-2);touch-action:none}
.ctl button.ac{background:var(--accent);color:var(--on-accent)}
.ctl button.tonal{background:var(--accent-soft)}
.ctl button.down:not(.ac){background:var(--accent-soft)}
.msg{text-align:center;min-height:1.5em;margin:0 0 8px;font-weight:600}
#sBoard{width:min(100%,420px);aspect-ratio:1;margin:0 auto 12px;touch-action:none;user-select:none;-webkit-user-select:none}
#sc{display:block;width:100%;height:100%;border-radius:12px}
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 id="title">Snake</h1>
    <a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>
<main class="wrap" id="app">
  <div class="chips" id="sSpeed"><button data-v="0">Langsam</button><button data-v="1">Normal</button><button data-v="2">Schnell</button><button id="sWrap">Durch Wände</button></div>
  <div class="stats"><div><b id="sScore">0</b><span>Punkte</span></div><div><b id="sBest">0</b><span>Rekord</span></div></div>
  <div id="sBoard"><canvas id="sc" aria-label="Spielfeld"></canvas></div>
  <p class="msg" id="sMsg" role="status">Tippe auf Start</p>
  <div class="ctl" id="sPad">
    <button id="sStart" class="ac">Start</button><button data-d="up" aria-label="Hoch">↑</button><button id="sNew" class="tonal">Neu</button>
    <button data-d="left" aria-label="Links">←</button><button data-d="down" aria-label="Runter">↓</button><button data-d="right" aria-label="Rechts">→</button>
  </div>
  <p class="muted" style="font-size:14px">Steuern per Pfeiltasten, WASD oder Wischen über das Spielfeld. Leertaste startet und pausiert. Die Schlange wird mit jedem Futter länger und etwas schneller.</p>
</main>
<script>
(function () {
"use strict";
/* =========================================================
   Snake
   ========================================================= */
const rnd = n => { const lim = 2 ** 32 - (2 ** 32 % n), a = new Uint32Array(1); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; };
const isTyping = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName) || e.target?.isContentEditable;
function onSwipe(el, fn, min = 24) {
  let s = null;
  el.addEventListener("pointerdown", e => { s = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  addEventListener("pointerup", e => {
    if (!s || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y, ax = Math.abs(dx), ay = Math.abs(dy); s = null;
    if (Math.max(ax, ay) >= min) fn(ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  addEventListener("pointercancel", () => { s = null; });
}
function onPress(el, fn) {
  el.addEventListener("pointerdown", e => { if (e.button > 0) return; e.preventDefault(); el.classList.add("down"); fn(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, () => el.classList.remove("down")));
  el.addEventListener("click", e => { if (e.detail === 0) fn(); });
}
/* CSS-Farbe (auch var()/color-mix) in eine für Canvas nutzbare Farbe auflösen */
const probe = document.createElement("i"); probe.style.display = "none"; document.body.appendChild(probe);
const css = v => { probe.style.color = v; return getComputedStyle(probe).color; };
const KEYS = { ArrowLeft: "left", ArrowUp: "up", ArrowRight: "right", ArrowDown: "down", a: "left", w: "up", d: "right", s: "down", A: "left", W: "up", D: "right", S: "down" };

const G = 17, SPEEDS = [190, 140, 95];
const cv = $("#sc"), ctx = cv.getContext("2d");
let px = 0, speed = store.get("snake.speed", 1), wrap = store.get("snake.wrap", false), best = store.get("snake.best", 0);
if (!SPEEDS[speed]) speed = 1;
let snake, dir, queue, food, score, running = false, dead = false, timer = 0, T = {};
onLeave(() => clearTimeout(timer));

function theme() { T = { sf2: css("var(--surface-2)"), bd: css("var(--border)"), err: css("var(--err)"), ac: css("var(--accent)"), tx: css("var(--text)") }; }
function chips() {
  $$("#sSpeed button[data-v]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === speed));
  $("#sWrap").setAttribute("aria-pressed", wrap);
  $("#sBest").textContent = best;
}
function size() {
  const W = $("#sBoard").clientWidth, r = devicePixelRatio || 1;
  if (!W) return;
  px = W / G;
  cv.width = cv.height = Math.round(W * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
  draw();
}
function reset() {
  const m = Math.floor(G / 2);
  snake = [[m, m], [m - 1, m], [m - 2, m]]; dir = "right"; queue = []; score = 0; dead = false;
  placeFood(); $("#sScore").textContent = 0;
}
function placeFood() {
  const free = [];
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
  food = free.length ? free[rnd(free.length)] : null;
}
const OPP = { up: "down", down: "up", left: "right", right: "left" };
function turn(d) {
  if (dead) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d !== last && d !== OPP[last] && queue.length < 3) queue.push(d);
  if (!running) start();
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = snake[0];
  let x = h[0] + (dir === "right" ? 1 : dir === "left" ? -1 : 0), y = h[1] + (dir === "down" ? 1 : dir === "up" ? -1 : 0);
  if (wrap) { x = (x + G) % G; y = (y + G) % G; }
  else if (x < 0 || y < 0 || x >= G || y >= G) return die();
  const eat = food && x === food[0] && y === food[1];
  for (let i = 0; i < snake.length - (eat ? 0 : 1); i++) if (snake[i][0] === x && snake[i][1] === y) return die();
  snake.unshift([x, y]);
  if (eat) { score++; $("#sScore").textContent = score; placeFood(); } else snake.pop();
  draw();
  timer = setTimeout(step, Math.max(55, SPEEDS[speed] - score * 2));
}
function die() {
  running = false; dead = true; draw();
  if (score > best) { best = score; store.set("snake.best", best); }
  chips();
  $("#sMsg").textContent = "Vorbei! " + score + " Punkte – tippe auf Neu";
  $("#sStart").textContent = "Start";
}
function start() {
  if (dead) reset();
  if (running) return;
  running = true; $("#sMsg").textContent = ""; $("#sStart").textContent = "Pause";
  clearTimeout(timer); timer = setTimeout(step, SPEEDS[speed]);
}
function pause() {
  if (!running) return;
  running = false; clearTimeout(timer); $("#sMsg").textContent = "Pause"; $("#sStart").textContent = "Weiter";
}
function newRound() { clearTimeout(timer); running = false; reset(); draw(); $("#sStart").textContent = "Start"; $("#sMsg").textContent = "Tippe auf Start"; }
const cell = (x, y, inset, col) => { ctx.fillStyle = col; ctx.fillRect(x * px + inset, y * px + inset, px - inset * 2, px - inset * 2); };
function draw() {
  if (!px) return;
  const W = px * G;
  ctx.fillStyle = T.sf2; ctx.fillRect(0, 0, W, W);
  if (!wrap) { ctx.strokeStyle = T.bd; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, W - 2); }
  if (food) { ctx.fillStyle = T.err; ctx.beginPath(); ctx.arc((food[0] + 0.5) * px, (food[1] + 0.5) * px, px * 0.38, 0, Math.PI * 2); ctx.fill(); }
  if (!snake) return;
  for (let i = snake.length - 1; i >= 0; i--) cell(snake[i][0], snake[i][1], 1, i ? T.ac : (dead ? T.err : T.tx));
}

onSwipe($("#sBoard"), turn, 16);
addEventListener("keydown", e => {
  if (isTyping(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const d = KEYS[e.key];
  if (d) { e.preventDefault(); turn(d); }
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); running ? pause() : start(); }
});
$$("#sPad button[data-d]").forEach(b => onPress(b, () => turn(b.dataset.d)));
onPress($("#sStart"), () => running ? pause() : start());
onPress($("#sNew"), newRound);
$("#sSpeed").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "sWrap") { wrap = !wrap; store.set("snake.wrap", wrap); }
  else { speed = +b.dataset.v; store.set("snake.speed", speed); }
  chips(); draw();
};
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
addEventListener("blur", pause);
mql.addEventListener?.("change", () => { theme(); draw(); });
new ResizeObserver(size).observe($("#sBoard"));
theme(); reset(); chips(); size();
})();
</script>
</body>
</html>
